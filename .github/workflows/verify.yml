name: Verify

on:
  pull_request:

permissions: {}

concurrency:
  group: verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          version: v2026.9.11
          cache: false

      - name: Clone shared AWS SDK
        # Cloned to the script's default SDK_DIR so it can symlink it into
        # each side of the A/B run.
        run: |
          git clone --depth 1 https://github.com/aws/aws-sdk-java-v2 "$HOME/.cache/aws-sdk-java-v2"

      - name: Verify baseline vs candidate
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          scripts/verify-deps.sh HEAD^1
