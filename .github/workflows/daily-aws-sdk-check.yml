name: Daily AWS SDK Paginator Check

on:
  schedule:
    # Runs at 7:00 AM UTC every day
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: write

jobs:
  check-aws-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2
        with:
          version: v2026.10.14
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Clone AWS SDK Java v2
        run: |
          git clone --depth 1 https://github.com/aws/aws-sdk-java-v2 aws-sdk-java-v2

      - name: Run TypeScript script
        run: bun run find-aws-sdk-paginators.ts

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md PAGINATORS.md
          git diff --staged --quiet || git commit -m "Update AWS SDK paginator list"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push
